<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--IMPORTING FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--IMPORTING MOMENT-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>

    <!--IMPORING MOMENT TIMEZONES-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.47/moment-timezone-with-data-1970-2030.min.js"></script>

     <!--IMPORTING AXIOS-->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <link rel="stylesheet" href="src/styles.css" type="text/css">
    
    <title>WORLD CLOCK 🕰️</title>
</head>
<body>
    <div class="app-wrapper">
        <header>
            <h1>World Clock</h1>

            <select name="choose-city" id="choose-city" class="choose-city">
                <option value="choose-city">Choose a city:</option>
                <option value="current">My current location</option>
                <option value="sydney">Sydney</option>
                <option value="moscow">Moscow</option>
                <option value="berlin">Berlin</option>
                <option value="vatican">Florence</option>
                <option value="new-york">New York</option>
            </select>
        </header>

        <main>

            <div id="cities">
                <div class="city" id="rio-janeiro">
                    <span>
                        <h2>Rio de Janeiro</h2>
                        <p class="date"></p>
                    </span>
                    <div class="time"></div>
                </div>
            
                <div class="city" id="sao-paulo">
                    <span>
                        <h2>São Paulo</h2>
                        <p class="date"></p>
                    </span>
                    <div class="time"></div>
                </div>
            </div>

        </main>

    </div>

    <footer>
        <div class="footer-wrapper">
            This World Clock was built by <a class="git-profile" href="https://github.com/ayscd">Ayeska</a>,
            is linked to <a class="git-project" href="https://github.com/ayscd/world-clock">Git Hub</a>
            and hosted on <a class="host-link" href="https://tik-tak-worldwide.netlify.app/">Netlify</a>.
        </div>
    </footer>

    <script src="src/index.js"></script>
</body>
</html>
