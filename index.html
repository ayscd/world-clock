<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles.css" type="text">
    <title>WORLD CLOCK 🕰️</title>
</head>
<body>
    <div class="app-wrapper">
        <h1>WORLD CLOCK 🕰️</h1>

        <select name="choose-city" id="choose-city">
            <option value="">Choose a city:</option>
            <option value="">Salvador</option>
            <option value="">Vitória</option>
            <option value="">Belo Horizonte</option>
            <option value="">Florianópolis</option>
            <option value="">Curitiba</option>
        </select>

        <div class="city">
            <h2>Rio de Janeiro</h2>
            <div class="date"> 09/04/2025</div>
            <div class="time">19:11:15</div>
        </div>

        <div class="city">
            <h2>Brasília</h2>
            <div class="date"> 09/04/2025</div>
            <div class="time">19:11:15</div>
        </div>

        <hr/>
        <footer>
            <div class="footer-wrapper">
                This World Clock was built by <a class="git-profile" href="https://github.com/ayscd">Ayeska</a>,
                is linked to <a class="git-project" href="https://github.com/ayscd/world-clock">Git Hub</a>
                and hosted on <a class="host-link" href="https://tik-tak-worldwide.netlify.app/">Netlify</a>.
            </div>
        </footer>
    </div>

    <script src="src/index.js"></script>
</body>
</html>
